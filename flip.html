<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naija Gain — Coin Flip</title>
<script src="https://telegram.org/js/telegram-web-app.js" defer></script>
<style>
  :root{
    --bg-deep: #0B3D2E;
    --bg-deep2: #0F4D3A;
    --gold: #FFC93C;
    --gold-dark: #D9A02B;
    --cream: #FBF3DC;
    --red: #E4572E;
    --muted: #B9D9C9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: radial-gradient(circle at 50% 0%, var(--bg-deep2), var(--bg-deep) 70%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--cream);
    padding: 24px 16px 40px;
    overflow-x:hidden;
  }
  .brand{ font-size: 28px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 2px; text-align:center; }
  .brand span{ color: var(--gold); }
  .tagline{ font-size: 13px; color: var(--muted); margin-bottom: 22px; text-align:center; }
  .balance{
    display:flex; align-items:center; gap:8px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,201,60,0.35);
    padding: 8px 18px; border-radius: 999px;
    margin-bottom: 8px; font-weight:700; font-size: 15px;
  }
  .coin-dot{
    width:18px;height:18px;border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #FFE9A8, var(--gold) 60%, var(--gold-dark));
    box-shadow: 0 0 8px rgba(255,201,60,0.6);
  }
  .sync-note{ font-size: 11px; color: rgba(185,217,201,0.7); margin-bottom: 18px; text-align:center; }

  .coin-3d-wrap{
    width: 220px; height: 220px;
    margin-bottom: 20px;
    position: relative;
  }
  .coin-3d-wrap canvas{
    width: 100% !important;
    height: 100% !important;
    display: block;
  }

  .pick-label{ font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .side-picker{ display:flex; gap:10px; margin-bottom: 22px; }
  .side-btn{
    appearance:none; border:none; cursor:pointer;
    padding: 10px 22px; border-radius: 999px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,201,60,0.3);
    color: var(--cream); font-weight:800; font-size: 14px;
  }
  .side-btn.selected{
    background: linear-gradient(180deg, #F6D46B, var(--gold-dark));
    color: #3a2a06; border-color: transparent;
  }

  .stake-label{ font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .stake-picker{ display:flex; gap:8px; margin-bottom: 26px; flex-wrap:wrap; justify-content:center; }
  .stake-btn{
    appearance:none; border:none; cursor:pointer;
    padding: 9px 16px; border-radius: 12px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,201,60,0.3);
    color: var(--cream); font-weight:700; font-size: 13px;
  }
  .stake-btn.selected{
    background: linear-gradient(180deg, #F6D46B, var(--gold-dark));
    color: #3a2a06; border-color: transparent;
  }
  .stake-btn:disabled{ opacity:0.35; cursor:default; }
  .custom-stake-input{
    width: 180px;
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid rgba(255,201,60,0.4);
    background: rgba(255,255,255,0.08);
    color: var(--cream);
    font-size: 15px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 26px;
    outline: none;
  }
  .custom-stake-input::placeholder{ color: rgba(251,243,220,0.5); font-weight:500; }

  .flip-btn{
    appearance:none; border:none; cursor:pointer;
    background: linear-gradient(180deg, #F6D46B, var(--gold-dark));
    color: #3a2a06; font-weight:800; font-size:17px; letter-spacing:0.02em;
    padding: 14px 46px; border-radius: 999px;
    box-shadow: 0 4px 0 #8f6a13, 0 10px 20px rgba(0,0,0,0.35);
    transition: transform 0.08s ease;
  }
  .flip-btn:active{ transform: translateY(3px); box-shadow: 0 1px 0 #8f6a13, 0 4px 10px rgba(0,0,0,0.35); }
  .flip-btn:disabled{ opacity:0.55; cursor:default; }

  .stake-note{ margin-top: 14px; font-size: 13px; color: var(--muted); text-align:center; }
  .back-link{ margin-top: 22px; font-size: 13px; color: var(--gold); text-decoration:none; }

  .result{
    position:fixed; inset:0;
    background: rgba(6,20,15,0.72);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition: opacity 0.25s ease;
    z-index: 20;
  }
  .result.show{ opacity:1; pointer-events:auto; }
  .result-card{
    background: linear-gradient(180deg, var(--bg-deep2), var(--bg-deep));
    border: 2px solid var(--gold); border-radius: 20px;
    padding: 32px 28px; text-align:center; max-width: 280px;
    transform: scale(0.85); transition: transform 0.25s ease;
  }
  .result.show .result-card{ transform: scale(1); }
  .result-emoji{ font-size:44px; margin-bottom:6px; }
  .result-title{ font-size:20px; font-weight:800; color:var(--gold); margin-bottom:4px; }
  .result-sub{ font-size:13px; color:var(--muted); margin-bottom:20px; }
  .result-close{
    appearance:none; border:none; cursor:pointer;
    background: var(--gold); color:#3a2a06; font-weight:700;
    padding: 10px 28px; border-radius: 999px; font-size:14px;
  }
</style>
</head>
<body>

  <div class="brand">Naija <span>Gain</span></div>
  <div class="tagline">Call it right. Double your stake.</div>

  <div class="balance"><span class="coin-dot"></span><span id="balanceText">Loading...</span></div>
  <div class="sync-note" id="syncNote">Loading your saved progress...</div>

  <div class="coin-3d-wrap">
    <canvas id="coinCanvas"></canvas>
  </div>

  <div class="pick-label">Heads or Tails?</div>
  <div class="side-picker" id="sidePicker">
    <button class="side-btn" data-side="heads">Heads</button>
    <button class="side-btn" data-side="tails">Tails</button>
  </div>

  <div class="stake-label">Stake how many coins?</div>
  <div class="stake-picker" id="stakePicker">
    <button class="stake-btn" data-stake="5">5</button>
    <button class="stake-btn" data-stake="10">10</button>
    <button class="stake-btn" data-stake="25">25</button>
    <button class="stake-btn" data-stake="50">50</button>
    <button class="stake-btn" id="customStakeBtn" data-stake="custom">Custom</button>
  </div>
  <input type="number" id="customStakeInput" class="custom-stake-input" placeholder="Enter amount" inputmode="numeric" min="1" style="display:none;">

  <button class="flip-btn" id="flipBtn" disabled>Flip the Coin</button>
  <div class="stake-note" id="stakeNote">Loading...</div>
  <a href="index.html" class="back-link">← Back to games</a>

  <div class="result" id="resultOverlay">
    <div class="result-card">
      <div class="result-emoji" id="resultEmoji">🎉</div>
      <div class="result-title" id="resultTitle">You won!</div>
      <div class="result-sub" id="resultSub"></div>
      <button class="result-close" id="resultClose">Nice!</button>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
  import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCmT04ri3vMD0O2rxelhVvF8cn2624OdGY",
    authDomain: "naija-gain.firebaseapp.com",
    databaseURL: "https://naija-gain-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "naija-gain",
    storageBucket: "naija-gain.firebasestorage.app",
    messagingSenderId: "384942407595",
    appId: "1:384942407595:web:eaa6efdb65926fd378dcee"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg && tg.ready) { try { tg.ready(); tg.expand(); } catch(e){} }

  function getPlayerId(){
    if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) {
      return "tg_" + tg.initDataUnsafe.user.id;
    }
    let guestId = localStorage.getItem('guestId');
    if (!guestId) {
      guestId = "guest_" + Math.random().toString(36).slice(2, 10);
      try { localStorage.setItem('guestId', guestId); } catch(e){}
    }
    return guestId;
  }
  const playerId = getPlayerId();
  const playerRef = ref(db, 'players/' + playerId);

  function withTimeout(promise, fallbackValue, ms = 4000){
    return Promise.race([
      promise,
      new Promise((resolve) => setTimeout(() => resolve(fallbackValue), ms))
    ]);
  }

  async function dbLoad(){
    try {
      const snapshot = await withTimeout(get(playerRef), null, 4000);
      if (snapshot && snapshot.exists && snapshot.exists()) return snapshot.val();
      return null;
    } catch(e) { return null; }
  }

  async function dbSave(patch){
    try {
      const current = await dbLoad();
      const merged = Object.assign({}, current || {}, patch);
      await withTimeout(set(playerRef, merged), undefined, 4000);
    } catch(e) { /* save failed silently — next flip will try again */ }
  }

  // ---------- 3D Coin setup ----------
  const canvas = document.getElementById('coinCanvas');
  const wrap = document.querySelector('.coin-3d-wrap');

  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
  camera.position.set(0, 0.9, 4.6);
  camera.lookAt(0, 0, 0);

  function resizeRenderer(){
    const size = wrap.clientWidth || 220;
    renderer.setSize(size, size, false);
    camera.aspect = 1;
    camera.updateProjectionMatrix();
  }
  resizeRenderer();
  window.addEventListener('resize', resizeRenderer);

  scene.add(new THREE.AmbientLight(0xfff3d6, 0.75));
  const keyLight = new THREE.DirectionalLight(0xffe9a8, 1.1);
  keyLight.position.set(2, 3, 4);
  scene.add(keyLight);
  const fillLight = new THREE.DirectionalLight(0x8fd9c4, 0.25);
  fillLight.position.set(-3, -1, 2);
  scene.add(fillLight);

  // Draw a coin face onto a canvas, used as a texture
  function makeFaceTexture(label, sublabel){
    const size = 512;
    const c = document.createElement('canvas');
    c.width = size; c.height = size;
    const ctx = c.getContext('2d');

    const grad = ctx.createRadialGradient(size*0.35, size*0.3, size*0.05, size*0.5, size*0.5, size*0.55);
    grad.addColorStop(0, '#FFE9A8');
    grad.addColorStop(0.55, '#FFC93C');
    grad.addColorStop(1, '#B9821F');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(size/2, size/2, size/2 - 6, 0, Math.PI*2);
    ctx.fill();

    ctx.strokeStyle = '#3a2a06';
    ctx.lineWidth = 10;
    ctx.beginPath();
    ctx.arc(size/2, size/2, size/2 - 22, 0, Math.PI*2);
    ctx.stroke();

    ctx.fillStyle = '#3a2a06';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 190px sans-serif';
    ctx.fillText(label, size/2, size/2 - 10);

    ctx.font = 'bold 34px sans-serif';
    ctx.fillText(sublabel, size/2, size/2 + 130);

    const tex = new THREE.CanvasTexture(c);
    tex.needsUpdate = true;
    return tex;
  }

  const headsTexture = makeFaceTexture('H', 'NAIJA GAIN');
  const tailsTexture = makeFaceTexture('T', 'NAIJA GAIN');

  const coin = new THREE.Group();

  // Edge (the coin's rim) — open-ended cylinder, no caps, so it can't
  // interfere with the flat face textures.
  const edgeGeometry = new THREE.CylinderGeometry(1, 1, 0.22, 56, 1, true);
  edgeGeometry.rotateX(Math.PI / 2); // axis now runs along Z, matching the faces below
  const sideMaterial = new THREE.MeshStandardMaterial({ color: 0xD9A02B, metalness: 0.65, roughness: 0.35 });
  const edge = new THREE.Mesh(edgeGeometry, sideMaterial);
  coin.add(edge);

  // Front face (heads) — a flat disc facing the camera at rest (+Z), with
  // a plain, predictable UV mapping so the text always sits upright.
  const headsMaterial = new THREE.MeshStandardMaterial({ map: headsTexture, metalness: 0.4, roughness: 0.35, side: THREE.DoubleSide });
  const frontDisc = new THREE.Mesh(new THREE.CircleGeometry(1, 56), headsMaterial);
  frontDisc.position.z = 0.11;
  coin.add(frontDisc);

  // Back face (tails) — same disc, mounted facing the other way. When the
  // coin flips 180°, this rotates around to face the camera right-side up.
  const tailsMaterial = new THREE.MeshStandardMaterial({ map: tailsTexture, metalness: 0.4, roughness: 0.35, side: THREE.DoubleSide });
  const backDisc = new THREE.Mesh(new THREE.CircleGeometry(1, 56), tailsMaterial);
  backDisc.position.z = -0.11;
  backDisc.rotation.y = Math.PI;
  coin.add(backDisc);

  scene.add(coin);

  let idleTime = 0;
  let flipAnim = null; // { startTime, duration, fromX, toX }

  function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }

  function renderLoop(now){
    if (flipAnim) {
      const elapsed = now - flipAnim.startTime;
      const t = Math.min(elapsed / flipAnim.duration, 1);
      const eased = easeOutCubic(t);
      coin.rotation.x = flipAnim.fromX + (flipAnim.toX - flipAnim.fromX) * eased;
      if (t >= 1) {
        const finished = flipAnim;
        flipAnim = null;
        if (finished.onDone) finished.onDone();
      }
    } else {
      idleTime += 0.008;
      coin.rotation.x = Math.sin(idleTime) * 0.06; // gentle idle wobble
      coin.position.y = Math.sin(idleTime * 1.3) * 0.05;
    }
    renderer.render(scene, camera);
    requestAnimationFrame(renderLoop);
  }
  requestAnimationFrame(renderLoop);

  // outcome: "heads" or "tails". Always resets and spins fresh each flip.
  function flipCoinTo(outcome, onDone){
    const extraSpins = 4 + Math.floor(Math.random() * 3); // 4–6 full spins for flair
    const landing = extraSpins * Math.PI * 2 + (outcome === 'tails' ? Math.PI : 0);
    coin.rotation.x = 0;
    flipAnim = {
      startTime: performance.now(),
      duration: 1300,
      fromX: 0,
      toX: landing,
      onDone: onDone
    };
  }

  // ---------- Game state ----------
  let coinBalance = 0;
  let selectedSide = null;
  let selectedStake = null;
  let flipping = false;

  const balanceText = document.getElementById('balanceText');
  const syncNote = document.getElementById('syncNote');
  const sidePicker = document.getElementById('sidePicker');
  const stakePicker = document.getElementById('stakePicker');
  const customStakeBtn = document.getElementById('customStakeBtn');
  const customStakeInput = document.getElementById('customStakeInput');
  const flipBtn = document.getElementById('flipBtn');
  const stakeNote = document.getElementById('stakeNote');
  const resultOverlay = document.getElementById('resultOverlay');
  const resultEmoji = document.getElementById('resultEmoji');
  const resultTitle = document.getElementById('resultTitle');
  const resultSub = document.getElementById('resultSub');
  const resultClose = document.getElementById('resultClose');

  function updateHUD(){
    balanceText.textContent = coinBalance + " coins";

    document.querySelectorAll('.stake-btn').forEach(btn => {
      if (btn.dataset.stake === 'custom') {
        btn.disabled = coinBalance < 1;
        return;
      }
      const amt = parseInt(btn.dataset.stake, 10);
      btn.disabled = amt > coinBalance;
      if (amt > coinBalance && btn.classList.contains('selected')) {
        btn.classList.remove('selected');
        selectedStake = null;
      }
    });

    if (coinBalance < 5) {
      stakeNote.textContent = "You need at least 5 coins to play — go earn some on Spin or Dice.";
    } else {
      stakeNote.textContent = "Winning doubles your stake. Losing forfeits it.";
    }

    flipBtn.disabled = flipping || selectedSide === null || selectedStake === null || selectedStake > coinBalance;
  }

  async function loadProgress(){
    try {
      const data = await dbLoad();
      coinBalance = (data && typeof data.coinBalance === 'number') ? data.coinBalance : 0;
      syncNote.textContent = "Progress saved to your account — same on every device";
    } catch(e) {
      coinBalance = 0;
      syncNote.textContent = "Couldn't load saved progress — starting fresh";
    }
    updateHUD();
  }

  sidePicker.addEventListener('click', (e) => {
    const btn = e.target.closest('.side-btn');
    if (!btn || flipping) return;
    selectedSide = btn.dataset.side;
    document.querySelectorAll('.side-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    updateHUD();
  });

  stakePicker.addEventListener('click', (e) => {
    const btn = e.target.closest('.stake-btn');
    if (!btn || flipping || btn.disabled) return;

    document.querySelectorAll('.stake-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');

    if (btn.dataset.stake === 'custom') {
      customStakeInput.style.display = 'block';
      customStakeInput.max = coinBalance;
      customStakeInput.focus();
      selectedStake = null; // wait for a valid typed amount
    } else {
      customStakeInput.style.display = 'none';
      selectedStake = parseInt(btn.dataset.stake, 10);
    }
    updateHUD();
  });

  customStakeInput.addEventListener('input', () => {
    let val = parseInt(customStakeInput.value, 10);
    if (isNaN(val) || val < 1) {
      selectedStake = null;
    } else {
      if (val > coinBalance) val = coinBalance;
      customStakeInput.value = val;
      selectedStake = val;
    }
    flipBtn.disabled = flipping || selectedSide === null || selectedStake === null;
  });

  function flip(){
    if (flipping || selectedSide === null || selectedStake === null || selectedStake > coinBalance) return;
    flipping = true;
    flipBtn.disabled = true;

    const outcome = Math.random() < 0.5 ? "heads" : "tails";
    flipCoinTo(outcome, () => onFlipComplete(outcome));
  }

  async function onFlipComplete(outcome){
    const won = outcome === selectedSide;

    if (won) {
      coinBalance += selectedStake;
      resultEmoji.textContent = "🏆";
      resultTitle.textContent = "You won " + selectedStake + " coins!";
      resultSub.textContent = "It landed on " + outcome + " — balance: " + coinBalance + " coins";
    } else {
      coinBalance -= selectedStake;
      resultEmoji.textContent = "💔";
      resultTitle.textContent = "Lost " + selectedStake + " coins";
      resultSub.textContent = "It landed on " + outcome + " — balance: " + coinBalance + " coins";
    }

    await dbSave({ coinBalance: coinBalance });
    flipping = false;
    selectedStake = null;
    document.querySelectorAll('.stake-btn').forEach(b => b.classList.remove('selected'));
    customStakeInput.style.display = 'none';
    customStakeInput.value = '';
    updateHUD();
    resultOverlay.classList.add('show');
  }

  resultClose.addEventListener('click', () => {
    resultOverlay.classList.remove('show');
    updateHUD();
  });

  flipBtn.addEventListener('click', flip);

  loadProgress();
</script>

</body>
</html>
