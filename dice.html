<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naija Gain — Dice Roll</title>
<script src="https://telegram.org/js/telegram-web-app.js" defer></script>
<style>
  :root{
    --bg-deep: #0B3D2E;
    --bg-deep2: #0F4D3A;
    --gold: #FFC93C;
    --gold-dark: #D9A02B;
    --cream: #FBF3DC;
    --red: #E4572E;
    --card-dark: #08291F;
    --muted: #B9D9C9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background: radial-gradient(circle at 50% 0%, var(--bg-deep2), var(--bg-deep) 70%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--cream);
    padding: 24px 16px 40px;
    overflow-x:hidden;
  }
  .brand{ font-size: 28px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 2px; text-align:center; }
  .brand span{ color: var(--gold); }
  .tagline{ font-size: 13px; color: var(--muted); margin-bottom: 22px; text-align:center; }
  .balance{
    display:flex; align-items:center; gap:8px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,201,60,0.35);
    padding: 8px 18px; border-radius: 999px;
    margin-bottom: 8px; font-weight:700; font-size: 15px;
  }
  .coin-dot{
    width:18px;height:18px;border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #FFE9A8, var(--gold) 60%, var(--gold-dark));
    box-shadow: 0 0 8px rgba(255,201,60,0.6);
  }
  .sync-note{ font-size: 11px; color: rgba(185,217,201,0.7); margin-bottom: 24px; text-align:center; }

  .die-wrap{width:164px;height:164px;margin-bottom:30px;display:grid;place-items:center;perspective:900px;position:relative;}
  .die-shadow{position:absolute;width:112px;height:24px;bottom:4px;border-radius:50%;background:rgba(0,0,0,.34);filter:blur(10px);}
  .die-cube{position:relative;width:112px;height:112px;transform-style:preserve-3d;transform:rotateX(-18deg) rotateY(-24deg);transition:transform .65s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 18px 16px rgba(0,0,0,.34));}
  .die-cube.rolling{animation:diceRoll .12s linear infinite;}
  @keyframes diceRoll{0%{transform:rotateX(0) rotateY(0) rotateZ(0) scale(1)}25%{transform:rotateX(90deg) rotateY(55deg) rotateZ(18deg) scale(1.05)}50%{transform:rotateX(180deg) rotateY(140deg) rotateZ(-12deg) scale(.96)}75%{transform:rotateX(270deg) rotateY(220deg) rotateZ(14deg) scale(1.04)}100%{transform:rotateX(360deg) rotateY(360deg) rotateZ(0) scale(1)}}
  .die-face{position:absolute;inset:0;padding:17px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:4px;align-items:center;justify-items:center;background:linear-gradient(145deg,#fffdf3,#f7edcf 62%,#ded0a9);border:1px solid rgba(80,60,20,.25);border-radius:18px;box-shadow:inset 5px 5px 10px rgba(255,255,255,.9),inset -6px -8px 12px rgba(120,90,30,.18);backface-visibility:hidden;}
  .pip{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#40372b,#17130f 70%);box-shadow:inset 2px 2px 3px rgba(255,255,255,.08),0 1px 2px rgba(0,0,0,.35);}
  .face-1{transform:translateZ(56px)} .face-2{transform:rotateX(90deg) translateZ(56px)} .face-3{transform:rotateY(90deg) translateZ(56px)} .face-4{transform:rotateY(-90deg) translateZ(56px)} .face-5{transform:rotateX(-90deg) translateZ(56px)} .face-6{transform:rotateY(180deg) translateZ(56px)}
  .face-1 .pip:nth-child(1),.face-2 .pip:nth-child(1),.face-2 .pip:nth-child(5),.face-3 .pip:nth-child(1),.face-3 .pip:nth-child(5),.face-3 .pip:nth-child(9),.face-4 .pip:nth-child(1),.face-4 .pip:nth-child(4),.face-4 .pip:nth-child(6),.face-4 .pip:nth-child(9),.face-5 .pip:nth-child(1),.face-5 .pip:nth-child(3),.face-5 .pip:nth-child(5),.face-5 .pip:nth-child(7),.face-5 .pip:nth-child(9),.face-6 .pip:nth-child(1),.face-6 .pip:nth-child(3),.face-6 .pip:nth-child(4),.face-6 .pip:nth-child(6),.face-6 .pip:nth-child(7),.face-6 .pip:nth-child(9){visibility:visible}
  .die-face .pip{visibility:hidden}
  .face-1 .pip:nth-child(5),.face-2 .pip:nth-child(1),.face-2 .pip:nth-child(9),.face-3 .pip:nth-child(1),.face-3 .pip:nth-child(5),.face-3 .pip:nth-child(9),.face-4 .pip:nth-child(1),.face-4 .pip:nth-child(4),.face-4 .pip:nth-child(6),.face-4 .pip:nth-child(9),.face-5 .pip:nth-child(1),.face-5 .pip:nth-child(3),.face-5 .pip:nth-child(5),.face-5 .pip:nth-child(7),.face-5 .pip:nth-child(9),.face-6 .pip:nth-child(1),.face-6 .pip:nth-child(3),.face-6 .pip:nth-child(5),.face-6 .pip:nth-child(7),.face-6 .pip:nth-child(9){visibility:visible}
  .die-cube.show-1{transform:rotateX(-18deg) rotateY(-24deg)} .die-cube.show-2{transform:rotateX(-90deg)} .die-cube.show-3{transform:rotateY(-90deg)} .die-cube.show-4{transform:rotateY(90deg)} .die-cube.show-5{transform:rotateX(90deg)} .die-cube.show-6{transform:rotateY(180deg)}


  .pick-label{ font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .picker{
    display:flex; gap:8px; margin-bottom: 26px;
  }
  .pick-btn{
    appearance:none; border:none; cursor:pointer;
    width: 42px; height: 42px;
    border-radius: 12px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,201,60,0.3);
    color: var(--cream);
    font-weight:800; font-size: 16px;
  }
  .pick-btn.selected{
    background: linear-gradient(180deg, #F6D46B, var(--gold-dark));
    color: #3a2a06;
    border-color: transparent;
  }
  .pick-btn:disabled{ opacity:0.5; cursor:default; }

  .roll-btn{
    appearance:none; border:none; cursor:pointer;
    background: linear-gradient(180deg, #F6D46B, var(--gold-dark));
    color: #3a2a06; font-weight:800; font-size:17px; letter-spacing:0.02em;
    padding: 14px 46px; border-radius: 999px;
    box-shadow: 0 4px 0 #8f6a13, 0 10px 20px rgba(0,0,0,0.35);
    transition: transform 0.08s ease;
  }
  .roll-btn:active{ transform: translateY(3px); box-shadow: 0 1px 0 #8f6a13, 0 4px 10px rgba(0,0,0,0.35); }
  .roll-btn:disabled{ opacity:0.55; cursor:default; }

  .rolls-left{ margin-top: 14px; font-size: 13px; color: var(--muted); }
  .back-link{ margin-top: 22px; font-size: 13px; color: var(--gold); text-decoration:none; }

  .result{
    position:fixed; inset:0;
    background: rgba(6,20,15,0.72);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition: opacity 0.25s ease;
    z-index: 20;
  }
  .result.show{ opacity:1; pointer-events:auto; }
  .result-card{
    background: linear-gradient(180deg, var(--bg-deep2), var(--bg-deep));
    border: 2px solid var(--gold); border-radius: 20px;
    padding: 32px 28px; text-align:center; max-width: 280px;
    transform: scale(0.85); transition: transform 0.25s ease;
  }
  .result.show .result-card{ transform: scale(1); }
  .result-mark{width:52px;height:52px;margin:0 auto 10px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:900;color:var(--gold);letter-spacing:.08em;}
  .result-title{ font-size:20px; font-weight:800; color:var(--gold); margin-bottom:4px; }
  .result-sub{ font-size:13px; color:var(--muted); margin-bottom:20px; }
  .result-close{
    appearance:none; border:none; cursor:pointer;
    background: var(--gold); color:#3a2a06; font-weight:700;
    padding: 10px 28px; border-radius: 999px; font-size:14px;
  }
</style>
</head>
<body>

  <div class="brand">Naija <span>Gain</span></div>
  <div class="tagline">Guess right. Double your luck.</div>

  <div class="balance"><span class="coin-dot"></span><span id="balanceText">Loading...</span></div>
  <div class="sync-note" id="syncNote">Loading your saved progress...</div>

  <div class="die-wrap" id="dieFace">
    <div class="die-shadow"></div>
    <div class="die-cube show-1" id="dieCube" aria-label="Dice showing 1">
      <div class="die-face face-1"><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i></div>
      <div class="die-face face-2"><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i></div>
      <div class="die-face face-3"><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i></div>
      <div class="die-face face-4"><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i></div>
      <div class="die-face face-5"><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i></div>
      <div class="die-face face-6"><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i></div>
    </div>
  </div>

  <div class="pick-label">Pick your number</div>
  <div class="picker" id="picker">
    <button class="pick-btn" data-num="1">1</button>
    <button class="pick-btn" data-num="2">2</button>
    <button class="pick-btn" data-num="3">3</button>
    <button class="pick-btn" data-num="4">4</button>
    <button class="pick-btn" data-num="5">5</button>
    <button class="pick-btn" data-num="6">6</button>
  </div>

  <button class="roll-btn" id="rollBtn" disabled>Roll the Dice</button>
  <div class="rolls-left" id="rollsLeft">Loading...</div>
  <a href="index.html" class="back-link">← Back to games</a>

  <div class="result" id="resultOverlay">
    <div class="result-card">
      <div class="result-mark" id="resultMark">WIN</div>
      <div class="result-title" id="resultTitle">You won!</div>
      <div class="result-sub" id="resultSub">Come back tomorrow for more rolls.</div>
      <button class="result-close" id="resultClose">Nice!</button>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCmT04ri3vMD0O2rxelhVvF8cn2624OdGY",
    authDomain: "naija-gain.firebaseapp.com",
    databaseURL: "https://naija-gain-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "naija-gain",
    storageBucket: "naija-gain.firebasestorage.app",
    messagingSenderId: "384942407595",
    appId: "1:384942407595:web:eaa6efdb65926fd378dcee"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg && tg.ready) { try { tg.ready(); tg.expand(); } catch(e){} }

  function getPlayerId(){
    if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) {
      return "tg_" + tg.initDataUnsafe.user.id;
    }
    let guestId = localStorage.getItem('guestId');
    if (!guestId) {
      guestId = "guest_" + Math.random().toString(36).slice(2, 10);
      try { localStorage.setItem('guestId', guestId); } catch(e){}
    }
    return guestId;
  }
  const playerId = getPlayerId();
  const playerRef = ref(db, 'players/' + playerId);

  function withTimeout(promise, fallbackValue, ms = 4000){
    return Promise.race([
      promise,
      new Promise((resolve) => setTimeout(() => resolve(fallbackValue), ms))
    ]);
  }

  async function dbLoad(){
    try {
      const snapshot = await withTimeout(get(playerRef), null, 4000);
      if (snapshot && snapshot.exists && snapshot.exists()) return snapshot.val();
      return null;
    } catch(e) { return null; }
  }

  async function dbSave(patch){
    try {
      // Merge with whatever's already there so we never wipe out the wheel's fields
      const current = await dbLoad();
      const merged = Object.assign({}, current || {}, patch);
      await withTimeout(set(playerRef, merged), undefined, 4000);
    } catch(e) { /* save failed silently — next roll will try again */ }
  }

  function todayStr(){
    const d = new Date();
    return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate();
  }

  let coinBalance = 0;
  let rollsLeft = 3;
  let selectedNum = null;
  let rolling = false;

  const balanceText = document.getElementById('balanceText');
  const syncNote = document.getElementById('syncNote');
  const dieFace = document.getElementById('dieFace');
  const dieCube = document.getElementById('dieCube');
  const picker = document.getElementById('picker');
  const rollBtn = document.getElementById('rollBtn');
  const rollsLeftEl = document.getElementById('rollsLeft');
  const resultOverlay = document.getElementById('resultOverlay');
  const resultTitle = document.getElementById('resultTitle');
  const resultSub = document.getElementById('resultSub');
  const resultClose = document.getElementById('resultClose');

  function updateHUD(){
    balanceText.textContent = coinBalance + " coins";
    rollsLeftEl.textContent = rollsLeft > 0
      ? rollsLeft + " free roll" + (rollsLeft===1?"":"s") + " left today"
      : "No free rolls left — come back tomorrow";
    rollBtn.disabled = rollsLeft <= 0 || rolling || selectedNum === null;
  }

  async function loadProgress(){
    try {
      const data = await dbLoad();
      coinBalance = (data && typeof data.coinBalance === 'number') ? data.coinBalance : 0;

      if (data && data.lastDiceDate === todayStr() && typeof data.diceRollsLeft === 'number') {
        rollsLeft = data.diceRollsLeft;
      } else {
        rollsLeft = 3; // new day, reset rolls
      }

      syncNote.textContent = "Progress saved to your account — same on every device";
    } catch(e) {
      coinBalance = 0;
      rollsLeft = 3;
      syncNote.textContent = "Couldn't load saved progress — starting fresh";
    }
    updateHUD();
  }

  async function saveProgress(){
    await dbSave({
      coinBalance: coinBalance,
      diceRollsLeft: rollsLeft,
      lastDiceDate: todayStr()
    });
  }

  picker.addEventListener('click', (e) => {
    const btn = e.target.closest('.pick-btn');
    if (!btn || rolling || rollsLeft <= 0) return;
    selectedNum = parseInt(btn.dataset.num, 10);
    document.querySelectorAll('.pick-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    updateHUD();
  });

  function roll(){
    if (rolling || rollsLeft <= 0 || selectedNum === null) return;
    rolling = true;
    rollBtn.disabled = true;
    dieCube.classList.remove('show-1','show-2','show-3','show-4','show-5','show-6');
    dieCube.classList.add('rolling');

    let ticks = 0;
    const maxTicks = 14;
    const interval = setInterval(() => {
      dieCube.style.transform = `rotateX(${Math.random()*360}deg) rotateY(${Math.random()*360}deg) rotateZ(${Math.random()*90-45}deg)`;
      ticks++;
      if (ticks >= maxTicks) {
        clearInterval(interval);
        const finalRoll = 1 + Math.floor(Math.random()*6);
        dieCube.classList.remove('rolling');
        dieCube.classList.add('show-' + finalRoll);
        dieCube.style.transform = '';
        dieCube.setAttribute('aria-label', 'Dice showing ' + finalRoll);
        onRollComplete(finalRoll);
      }
    }, 90);
  }

  async function onRollComplete(finalRoll){
    rollsLeft -= 1;
    const diff = Math.abs(finalRoll - selectedNum);

    if (diff === 0) {
      coinBalance += 30;
      document.getElementById('resultMark').textContent = 'WIN';
      resultTitle.textContent = "Exact match! +30 coins";
      resultSub.textContent = "Rolled " + finalRoll + " — balance: " + coinBalance + " coins";
    } else if (diff === 1) {
      coinBalance += 5;
      document.getElementById('resultMark').textContent = 'CLOSE';
      resultTitle.textContent = "So close! +5 coins";
      resultSub.textContent = "Rolled " + finalRoll + ", you picked " + selectedNum;
    } else {
      document.getElementById('resultMark').textContent = 'MISS';
      resultTitle.textContent = "No match this time";
      resultSub.textContent = "Rolled " + finalRoll + ", you picked " + selectedNum;
    }

    await saveProgress();
    rolling = false;
    updateHUD();
    resultOverlay.classList.add('show');
  }

  resultClose.addEventListener('click', () => {
    resultOverlay.classList.remove('show');
    updateHUD();
  });

  rollBtn.addEventListener('click', roll);

  loadProgress();
</script>

</body>
  </html>
