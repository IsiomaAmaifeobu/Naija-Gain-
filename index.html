<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naija Gain</title>
<style>
  :root{
    --bg-deep: #0B3D2E;
    --bg-deep2: #0F4D3A;
    --gold: #FFC93C;
    --gold-dark: #D9A02B;
    --cream: #FBF3DC;
    --wheel-dark: #08291F;
    --muted: #B9D9C9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    background: radial-gradient(circle at 50% 0%, var(--bg-deep2), var(--bg-deep) 70%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--cream);
    padding: 32px 18px 40px;
  }
  .brand{
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 2px;
    text-align:center;
  }
  .brand span{ color: var(--gold); }
  .tagline{
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 26px;
    text-align:center;
  }
  .balance{
    display:flex;
    align-items:center;
    gap:8px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,201,60,0.35);
    padding: 8px 18px;
    border-radius: 999px;
    margin-bottom: 30px;
    font-weight:700;
    font-size: 15px;
  }
  .coin-dot{
    width:16px;height:16px;border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #FFE9A8, var(--gold) 60%, var(--gold-dark));
    box-shadow: 0 0 8px rgba(255,201,60,0.6);
  }
  .section-label{
    align-self:flex-start;
    font-size:12px;
    color: var(--muted);
    margin: 4px 4px 10px;
    text-transform: none;
  }
  .games{
    width: 100%;
    max-width: 420px;
    display:flex;
    flex-direction:column;
    gap: 14px;
  }
  .game-card{
    display:flex;
    align-items:center;
    gap: 16px;
    background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,201,60,0.25);
    border-radius: 18px;
    padding: 16px 18px;
    text-decoration:none;
    color: var(--cream);
    transition: transform 0.12s ease, border-color 0.12s ease;
  }
  .game-card:active{
    transform: scale(0.98);
    border-color: rgba(255,201,60,0.6);
  }
  .game-icon{
    width: 52px;
    height: 52px;
    border-radius: 14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 26px;
    flex-shrink:0;
  }
  .game-info{ flex:1; }
  .game-title{
    font-weight: 800;
    font-size: 16px;
    margin-bottom: 3px;
  }
  .game-desc{
    font-size: 12.5px;
    color: var(--muted);
  }
  .game-arrow{
    font-size: 18px;
    color: var(--gold);
    flex-shrink:0;
  }
  .locked{
    opacity: 0.5;
    pointer-events: none;
  }
  .locked .game-desc{ font-style: normal; }
  .badge-soon{
    font-size: 10px;
    font-weight: 700;
    color: var(--bg-deep);
    background: var(--gold);
    padding: 2px 8px;
    border-radius: 999px;
    margin-left: 8px;
  }
  footer{
    margin-top: 36px;
    font-size: 11.5px;
    color: rgba(185,217,201,0.6);
    text-align:center;
  }
</style>
</head>
<body>

  <div class="brand">Naija <span>Gain</span></div>
  <div class="tagline">Pick a game. Spin, tap, win.</div>

  <div class="balance"><span class="coin-dot"></span><span>0 coins</span></div>

  <div class="section-label">Games</div>
  <div class="games">

    <a href="spin.html" class="game-card">
      <div class="game-icon" style="background:#8C2F1B;">🎡</div>
      <div class="game-info">
        <div class="game-title">Spin the Wheel</div>
        <div class="game-desc">3 free spins daily. Land big, win big.</div>
      </div>
      <div class="game-arrow">→</div>
    </a>

    <div class="game-card locked">
      <div class="game-icon" style="background:#0F6B45;">🎲</div>
      <div class="game-info">
        <div class="game-title">Dice Roll<span class="badge-soon">SOON</span></div>
        <div class="game-desc">Guess the roll, double your coins.</div>
      </div>
      <div class="game-arrow">→</div>
    </div>

    <div class="game-card locked">
      <div class="game-icon" style="background:#134E36;">🃏</div>
      <div class="game-info">
        <div class="game-title">Match Cards<span class="badge-soon">SOON</span></div>
        <div class="game-desc">Flip and match for bonus coins.</div>
      </div>
      <div class="game-arrow">→</div>
    </div>

  </div>

  <footer>More games added regularly — check back daily.</footer>

</body>
</html>
