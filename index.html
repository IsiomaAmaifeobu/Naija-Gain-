<script>
const firebaseConfig={apiKey:"AIzaSyCmT04ri3vMD0O2rxelhVvF8cn2624OdGY",authDomain:"naija-gain.firebaseapp.com",databaseURL:"https://naija-gain-default-rtdb.europe-west1.firebasedatabase.app",projectId:"naija-gain",storageBucket:"naija-gain.firebasestorage.app",messagingSenderId:"384942407595",appId:"1:384942407595:web:eaa6efdb65926fd378dcee"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
function getPlayerId(){if(tg?.initDataUnsafe?.user?.id)return"tg_"+tg.initDataUnsafe.user.id;let id=localStorage.getItem("guestId");if(!id){id="guest_"+Math.random().toString(36).slice(2,10);localStorage.setItem("guestId",id)}return id}
const playerId=getPlayerId(), playerRef=db.ref("players/"+playerId);

const AD_REWARDS=[20,20,20,20,20];
const AD_TIMEOUT_MS=45000;
const todayStr=()=>new Date().toISOString().slice(0,10);

function renderEarnTab(d){
  const watched=(d.adDate===todayStr())?Number(d.adsWatchedToday||0):0;
  document.getElementById("adsProgress").textContent=watched+" / "+AD_REWARDS.length;
  const list=document.getElementById("taskList");
  list.innerHTML="";
  AD_REWARDS.forEach((reward,i)=>{
    const row=document.createElement("div");
    row.className="task";
    const btn=document.createElement("button");
    if(i<watched){
      btn.className="task-btn done";btn.textContent="Watched";btn.disabled=true;
    }else if(i===watched){
      btn.className="task-btn watch";btn.textContent="Watch Ad";
      btn.onclick=()=>watchAd(i,reward,btn);
    }else{
      btn.className="task-btn locked";btn.textContent="Locked";btn.disabled=true;
    }
    row.innerHTML=`<div><div class="task-name">Ad ${i+1} of ${AD_REWARDS.length}</div><div class="task-reward">+${reward} coins</div></div>`;
    row.appendChild(btn);
    list.appendChild(row);
  });
}

// Waits for the ad SDK to signal completion, but never hangs forever:
// if it goes quiet for too long after the ad was shown, we treat it as
// watched anyway so the button can never get stuck.
function showAdWithTimeout(ms){
  return new Promise((resolve,reject)=>{
    let settled=false;
    const timer=setTimeout(()=>{
      if(!settled){settled=true;resolve('timeout')}
    },ms);
    Promise.resolve(show_11771755()).then(()=>{
      if(!settled){settled=true;clearTimeout(timer);resolve('completed')}
    }).catch(()=>{
      if(!settled){settled=true;clearTimeout(timer);reject(new Error('ad-failed'))}
    });
  });
}

async function watchAd(index,reward,btn){
  const note=document.getElementById("earnNote");
  btn.disabled=true;btn.textContent="Loading ad...";
  note.textContent="Opening ad...";
  try{
    const result=await showAdWithTimeout(AD_TIMEOUT_MS);
    note.textContent=result==='timeout'?"Ad finished — saving your reward...":"Ad watched — saving your reward...";
    const s=await playerRef.once("value");
    const d=s.val()||{};
    const today=todayStr();
    const watchedNow=(d.adDate===today)?Number(d.adsWatchedToday||0):0;
    if(watchedNow!==index){
      note.textContent="Already up to date.";
      await load();return;
    }
    const newBalance=Number(d.coinBalance||0)+reward;
    await playerRef.update({coinBalance:newBalance,adsWatchedToday:watchedNow+1,adDate:today});
    note.textContent=`+${reward} coins added! Keep going.`;
    await load();
  }catch(e){
    btn.disabled=false;btn.textContent="Watch Ad";
    note.textContent="The ad didn't load. Check your connection and try again.";
  }
}

async function load(){
  try{
    const s=await playerRef.once("value"),d=s.val()||{},b=Number(d.coinBalance||0),r=Number(d.referralCount||0);
    document.getElementById("topBalance").textContent=b.toLocaleString();
    document.getElementById("walletBalance").textContent=b.toLocaleString();
    document.getElementById("pbal").textContent=b.toLocaleString();
    document.getElementById("refCount").textContent=r;
    document.getElementById("pref").textContent=r;
    document.getElementById("pid").textContent=playerId.length>16?playerId.slice(0,13)+"…":playerId;
    document.getElementById("refLink").value="https://t.me/NaijaGain_bot?startapp="+playerId;
    renderEarnTab(d);
  }catch(e){}
}
document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.getElementById(b.dataset.page).classList.add("active");load()});
document.getElementById("copy").onclick=async()=>{const i=document.getElementById("refLink");try{await navigator.clipboard.writeText(i.value)}catch(e){i.select();document.execCommand("copy")}document.getElementById("copy").textContent="Copied!";setTimeout(()=>document.getElementById("copy").textContent="Copy Link",1400)};
load();
  </script>
