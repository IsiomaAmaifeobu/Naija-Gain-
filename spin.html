<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Naija Gain • Spin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box} body{margin:0;background:#070b12;color:#f7f8fb;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:480px;margin:auto;min-height:100vh;padding:18px 16px 30px;background:
radial-gradient(circle at 50% 5%,#17243a 0,#0a0f18 38%,#070b12 70%)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.back{width:42px;height:42px;border-radius:14px;border:1px solid #263249;background:#101827;color:#fff;font-size:22px}
.title{font-size:20px;font-weight:850} .sub{color:#8995aa;font-size:12px;margin-top:2px}
.balance{margin-left:auto;background:#111c2c;border:1px solid #26334b;border-radius:14px;padding:9px 11px;text-align:right}
.balance b{display:block;font-size:15px;color:#e4bd54} .balance span{font-size:9px;color:#8792a5;text-transform:uppercase;letter-spacing:.8px}
.card{border:1px solid #202c40;border-radius:26px;background:linear-gradient(180deg,#101a2a,#0b121d);padding:18px;box-shadow:0 22px 60px #0008}
.hint{text-align:center;color:#9ba7ba;font-size:12px;margin:0 0 12px}
.wheelbox{position:relative;width:min(82vw,340px);height:min(82vw,340px);max-width:340px;max-height:340px;margin:6px auto 18px}
.wheel{position:absolute;inset:9px;border-radius:50%;border:10px solid #d4af37;overflow:hidden;transform:rotate(0deg);transition:transform 4.4s cubic-bezier(.12,.72,.13,1);box-shadow:0 0 0 4px #0b111b,0 18px 45px #0009}
svg{width:100%;height:100%;display:block}
.pointer{position:absolute;z-index:4;top:-3px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:30px solid #fff;filter:drop-shadow(0 3px 4px #000)}
.hub{position:absolute;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);width:62px;height:62px;border-radius:50%;background:linear-gradient(145deg,#f6d978,#b88919);border:5px solid #151c29;box-shadow:0 5px 16px #0008;display:grid;place-items:center}
.hub span{width:25px;height:25px;border-radius:50%;background:#0b111b;border:3px solid #f5d66c}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 14px}
.stat{background:#0a111c;border:1px solid #202c3e;border-radius:15px;padding:10px;text-align:center}
.stat b{display:block;font-size:16px} .stat small{color:#7f8a9d;font-size:10px}
.spinbtn{width:100%;border:0;border-radius:17px;padding:15px;background:linear-gradient(180deg,#e7c65c,#b98c22);color:#111;font-weight:900;font-size:16px;box-shadow:0 9px 22px #c49a2d33}
.spinbtn:disabled{opacity:.45} .cost{text-align:center;color:#7e8a9e;font-size:10px;margin-top:9px}
.msg{min-height:18px;text-align:center;color:#c9d1df;font-size:12px;margin-top:10px}
.modal{position:fixed;inset:0;background:#02050acc;display:none;align-items:flex-end;justify-content:center;padding:16px;z-index:20}
.modal.show{display:flex} .sheet{width:min(480px,100%);background:#101827;border:1px solid #2a3850;border-radius:26px;padding:24px;text-align:center;box-shadow:0 -10px 50px #000b}
.reward{font-size:42px;font-weight:950;color:#e4bd54;margin:5px 0} .sheet h2{margin:0 0 4px;font-size:22px} .sheet p{color:#8d99ad;margin:5px 0 18px}
.close{width:100%;padding:13px;border:0;border-radius:15px;background:#e6c45a;font-weight:850}
.note{text-align:center;color:#657187;font-size:10px;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="back" onclick="history.back()">‹</button>
    <div><div class="title">Spin the Wheel</div><div class="sub">Test your luck • win virtual coins</div></div>
    <div class="balance"><b id="balance">0</b><span>coins</span></div>
  </div>

  <div class="card">
    <p class="hint">Tap SPIN and see where your luck lands.</p>
    <div class="wheelbox">
      <div class="pointer"></div>
      <div class="wheel" id="wheel">
        <svg viewBox="0 0 320 320" aria-label="Prize wheel">
          <defs>
            <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity=".35"/></filter>
          </defs>
          <g filter="url(#shadow)">
            <path d="M160 160 L160 10 A150 150 0 0 1 266.07 53.93 Z" fill="#d4af37"/>
            <path d="M160 160 L266.07 53.93 A150 150 0 0 1 310 160 Z" fill="#172f53"/>
            <path d="M160 160 L310 160 A150 150 0 0 1 266.07 266.07 Z" fill="#d4af37"/>
            <path d="M160 160 L266.07 266.07 A150 150 0 0 1 160 310 Z" fill="#172f53"/>
            <path d="M160 160 L160 310 A150 150 0 0 1 53.93 266.07 Z" fill="#d4af37"/>
            <path d="M160 160 L53.93 266.07 A150 150 0 0 1 10 160 Z" fill="#172f53"/>
            <path d="M160 160 L10 160 A150 150 0 0 1 53.93 53.93 Z" fill="#d4af37"/>
            <path d="M160 160 L53.93 53.93 A150 150 0 0 1 160 10 Z" fill="#172f53"/>
          </g>
          <g font-family="Arial,sans-serif" font-size="17" font-weight="900" text-anchor="middle">
            <g fill="#111"><text x="215" y="55" transform="rotate(22 215 55)">+5</text><text x="267" y="109" transform="rotate(67 267 109)">+10</text><text x="267" y="218" transform="rotate(112 267 218)">+20</text><text x="215" y="267" transform="rotate(157 215 267)">+50</text></g>
            <g fill="#f4f5f7"><text x="105" y="267" transform="rotate(-157 105 267)">+100</text><text x="53" y="218" transform="rotate(-112 53 218)">+25</text><text x="53" y="109" transform="rotate(-67 53 109)">+15</text><text x="105" y="55" transform="rotate(-22 105 55)">+2</text></g>
          </g>
        </svg>
      </div>
      <div class="hub"><span></span></div>
    </div>

    <div class="stats">
      <div class="stat"><b id="spins">0</b><small>SPINS</small></div>
      <div class="stat"><b id="won">0</b><small>WON</small></div>
      <div class="stat"><b id="best">0</b><small>BEST</small></div>
    </div>
    <button class="spinbtn" id="spinBtn" onclick="spin()">SPIN THE WHEEL</button>
    <div class="cost">Virtual coins only • no real-money wagering</div>
    <div class="msg" id="msg"></div>
  </div>
  <div class="note">Naija Gain • Spin responsibly</div>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <div class="reward" id="reward">+20</div>
    <h2 id="resultTitle">Nice spin!</h2>
    <p id="resultText">Coins have been added to your balance.</p>
    <button class="close" onclick="closeModal()">CONTINUE</button>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey:"AIzaSyCmT04ri3vMD0O2rxelhVvF8cn2624OdGY",
  authDomain:"naija-gain.firebaseapp.com",
  databaseURL:"https://naija-gain-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"naija-gain",
  storageBucket:"naija-gain.firebasestorage.app",
  messagingSenderId:"384942407595",
  appId:"1:384942407595:web:eaa6efdb65926fd378dcee"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();

let uid = tg?.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : "guest_" + Math.random().toString(36).slice(2);
let player = "tg_" + uid;
let data = {};
let spinning = false;
let angle = 0;
let spins = 0, won = 0, best = 0;

const prizes = [5,10,20,50,100,25,15,2];

async function load() {
  try {
    const s = await db.ref("users/"+player).once("value");
    data = s.val() || {};
    document.getElementById("balance").textContent = Number(data.coinBalance || 0).toLocaleString();
    spins = Number(data.spinCount || 0);
    won = Number(data.spinWon || 0);
    best = Number(data.spinBest || 0);
    updateStats();
  } catch(e) { document.getElementById("msg").textContent = "Could not load your balance."; }
}
function updateStats(){
  document.getElementById("spins").textContent=spins;
  document.getElementById("won").textContent=won;
  document.getElementById("best").textContent=best;
}
async function save(reward){
  const old = Number(data.coinBalance || 0);
  data.coinBalance = old + reward;
  data.spinCount = spins;
  data.spinWon = won;
  data.spinBest = best;
  data.lastSpin = Date.now();
  await db.ref("users/"+player).update(data);
  document.getElementById("balance").textContent=data.coinBalance.toLocaleString();
}
function spin(){
  if(spinning) return;
  spinning=true;
  const btn=document.getElementById("spinBtn");
  btn.disabled=true;
  document.getElementById("msg").textContent="Spinning...";
  const index=Math.floor(Math.random()*prizes.length);
  const reward=prizes[index];
  const slice=45;
  // pointer is at the top; each segment is 45 degrees.
  const target = 360*5 + (360 - (index*slice + slice/2));
  angle += target;
  document.getElementById("wheel").style.transform=`rotate(${angle}deg)`;
  setTimeout(async()=>{
    spins++; won++; best=Math.max(best,reward); updateStats();
    try{ await save(reward); }catch(e){}
    document.getElementById("reward").textContent="+"+reward;
    document.getElementById("resultTitle").textContent=reward>=50?"Big win!":reward>=20?"Great spin!":"Coins won!";
    document.getElementById("resultText").textContent=`You landed on ${reward} coins.`;
    document.getElementById("modal").classList.add("show");
    btn.disabled=false; spinning=false;
  },4500);
}
function closeModal(){
  document.getElementById("modal").classList.remove("show");
  document.getElementById("msg").textContent="Ready for another spin.";
}
load();
</script>
</body>
  </html>
